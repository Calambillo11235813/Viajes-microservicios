spring.application.name=core-transaccional

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:core_transaccional_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:nicolas123}   

# JPA properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:postgresql://localhost:5432/${DB_NAME:core_transaccional_db}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:nicolas123}

# Redis events
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.events.pagos-confirmados-channel=pagos.confirmados