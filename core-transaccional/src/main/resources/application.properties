# Importar el .env automáticamente
spring.config.import=optional:file:.env[.properties]

spring.application.name=core-transaccional
server.port=${SERVER_PORT:8080}

# PostgreSQL (variables en .env: DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/core_transaccional_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true
spring.flyway.out-of-order=true

# Redis (variables en .env: REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, REDIS_USERNAME, REDIS_SSL_ENABLED)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.username=${REDIS_USERNAME:}
app.events.boletos-emitir-channel=${REDIS_CHANNEL_BOLETOS_EMITIR:boletos.emitir}

# Motor IA (CU-09 Recomendación personalizada)
motor-ia.base-url=${MOTOR_IA_BASE_URL:http://localhost:8080}
motor-ia.timeout-seconds=${MOTOR_IA_TIMEOUT_SECONDS:15}
motor-ia.recomendacion-path=/api/recomendar-ruta/api/v1/recomendar-ruta/

# Motor IA - Endpoints gerenciales (CU10 / CU11)
motor-ia.reglas-asociacion-path=/api/reglas-asociacion/
motor-ia.estadisticas-clusters-path=/api/segmentar-usuario/estadisticas-clusters/
motor-ia.segmentar-usuario-path=/api/segmentar-usuario/segmentar-usuario/

# Dashboard BI - Tareas programadas
bi.cron.reglas-asociacion=0 0 2 * * ?
bi.cron.segmentacion-masiva=0 0 3 * * ?
bi.segmentacion.batch-size=50
bi.segmentacion.parallelism=3
bi.segmentacion.timeout-seconds=5

# DynamoDB - navegación (tracking write-only)
aws.dynamodb.enabled=${AWS_DYNAMODB_ENABLED:true}
aws.dynamodb.region=${AWS_DYNAMODB_REGION:us-east-2}
aws.dynamodb.clicks-table-name=${AWS_DYNAMODB_CLICKS_TABLE_NAME:ClicksViajero}
aws.dynamodb.feedback-table-name=${AWS_DYNAMODB_FEEDBACK_TABLE_NAME:FeedbackViajero}
aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT:}

# JWT (variables en .env: JWT_SECRET, JWT_EXPIRATION_MS)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Resilience4j - Motor IA (circuit breakers separados por endpoint)
resilience4j.circuitbreaker.instances.motorIaReglas.sliding-window-size=10
resilience4j.circuitbreaker.instances.motorIaReglas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.motorIaReglas.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.motorIaReglas.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.motorIaReglas.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.motorIaStats.sliding-window-size=10
resilience4j.circuitbreaker.instances.motorIaStats.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.motorIaStats.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.motorIaStats.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.motorIaStats.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.motorIaSegmentar.sliding-window-size=50
resilience4j.circuitbreaker.instances.motorIaSegmentar.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.motorIaSegmentar.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.motorIaSegmentar.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.motorIaSegmentar.minimum-number-of-calls=20

resilience4j.retry.instances.motorIaReglas.max-attempts=3
resilience4j.retry.instances.motorIaReglas.wait-duration=2s
resilience4j.retry.instances.motorIaStats.max-attempts=3
resilience4j.retry.instances.motorIaStats.wait-duration=2s
resilience4j.retry.instances.motorIaSegmentar.max-attempts=2
resilience4j.retry.instances.motorIaSegmentar.wait-duration=1s

# Demo CU-09: Nicolas, Klaus y Sebastian (recomendaciones personalizadas IA)
demo.cu09.nicolas.reservations=${DEMO_CU09_NICOLAS_RESERVATIONS:28}
demo.cu09.klaus.reservations=${DEMO_CU09_KLAUS_RESERVATIONS:10}
demo.cu09.sebastian.reservations=${DEMO_CU09_SEBASTIAN_RESERVATIONS:16}
