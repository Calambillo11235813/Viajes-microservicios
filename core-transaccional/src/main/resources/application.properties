spring.application.name=core-transaccional
server.port=9090
spring.data.hibernate.ddl-auto=create-drop

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/core_transaccional_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driverClassName=org.postgresql.Driver

# JPA properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

# Redis events
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.events.pagos-confirmados-channel=pagos.confirmados