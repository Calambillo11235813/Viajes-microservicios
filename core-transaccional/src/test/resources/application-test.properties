# Perfil test: valores fijos para CI y pruebas unitarias (no requiere .env)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.ssl.enabled=false
app.redis.enabled=false

motor-ia.base-url=http://localhost:9999
jwt.secret=test-jwt-secret-key-minimo-32-chars!!
jwt.expiration=86400000

aws.dynamodb.enabled=false
aws.dynamodb.region=us-east-1
aws.dynamodb.clicks-table-name=ClicksViajeroTest
aws.dynamodb.feedback-table-name=FeedbackViajeroTest
aws.dynamodb.endpoint=
