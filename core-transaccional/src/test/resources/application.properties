spring.datasource.url=jdbc:h2:mem:core_transaccional_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# DynamoDB (tests: sin endpoint real)
aws.dynamodb.enabled=true
aws.dynamodb.region=us-east-2
aws.dynamodb.table-name=NavegacionViajes
aws.dynamodb.endpoint=

# Motor IA
motor-ia.base-url=http://localhost:8000
motor-ia.recomendacion-path=/api/recomendar-ruta/api/v1/recomendar-ruta/

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.events.pagos-confirmados-channel=pagos.confirmados

# JWT (tests)
jwt.secret=viajes-test-secret-key-minimo-32-chars!
jwt.expiration=86400000
