<div class="min-h-screen bg-gray-50 flex flex-col font-sans">
  <!-- Header Navbar -->
  <nav class="bg-blue-600 p-4 shadow-md text-white flex justify-between items-center shrink-0">
    <div>
      <h1 class="text-xl font-bold tracking-wider">Dashboard Gerencial</h1>
      <p class="text-xs text-blue-200">Inteligencia de Negocios y Cross-Selling</p>
    </div>
    <div class="flex items-center gap-4">
      <button (click)="refrescarManual()" class="bg-blue-700 hover:bg-blue-800 p-2 rounded-full transition-colors shadow-sm" title="Refrescar Datos">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
      <div class="flex items-center border-l border-blue-400 pl-4 ml-2">
        <div class="w-8 h-8 rounded-full bg-blue-800 flex items-center justify-center font-bold mr-2 shadow-inner">G</div>
        <span class="text-sm font-medium hidden md:inline-block">Gerencia</span>
      </div>
      <button (click)="logout()" class="text-blue-100 hover:text-white hover:underline text-sm font-medium ml-2">Salir</button>
    </div>
  </nav>
  
  <!-- Main Content -->
  <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
    
    <!-- Error Alert -->
    <div *ngIf="error()" class="max-w-7xl mx-auto mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-md shadow-sm">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ error() }}</p>
        </div>
      </div>
    </div>

    <!-- Tabs Navigation -->
    <div class="max-w-7xl mx-auto border-b border-gray-200 bg-white shadow-sm mb-6 rounded-t-lg">
      <nav class="-mb-px flex space-x-4 sm:space-x-8 px-4 overflow-x-auto" aria-label="Tabs">
        <button (click)="setActiveTab('general')" 
                [class]="activeTab() === 'general' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
          📊 Resumen General
        </button>
        <button (click)="setActiveTab('evolucion')" 
                [class]="activeTab() === 'evolucion' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
          📈 Evolución Temporal
        </button>
        <button (click)="setActiveTab('cross-selling')" 
                [class]="activeTab() === 'cross-selling' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
          🔗 Oportunidades Cross-Selling
        </button>
        <button (click)="setActiveTab('heatmap')" 
                [class]="activeTab() === 'heatmap' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
          🗺️ Rutas Complementarias
        </button>
      </nav>
    </div>

    <!-- Tab Content -->
    <div class="max-w-7xl mx-auto space-y-6 min-h-[400px]">
      
      <!-- Resumen General -->
      <ng-container *ngIf="activeTab() === 'general'">
        <app-kpi-cards [kpis]="kpis$ | async"></app-kpi-cards>
        <div class="mt-6 h-[400px]">
          <app-cluster-distribution-chart 
            [distribucion]="distribucion$ | async" 
            class="h-full block">
          </app-cluster-distribution-chart>
        </div>
      </ng-container>

      <!-- Evolución Temporal -->
      <ng-container *ngIf="activeTab() === 'evolucion'">
        <div class="h-[500px]">
          <app-cluster-evolution-chart 
            [evolucion]="evolucion$ | async"
            (filtrosCambiados)="actualizarFiltrosEvolucion($event)"
            class="h-full block">
          </app-cluster-evolution-chart>
        </div>
      </ng-container>

      <!-- Oportunidades Cross-Selling -->
      <ng-container *ngIf="activeTab() === 'cross-selling'">
        <app-association-rules-table 
          [reglas]="reglas$ | async"
          [ordenActual]="ordenReglasSubject.value"
          (ordenCambiado)="cambiarOrdenReglas($event)">
        </app-association-rules-table>
      </ng-container>

      <!-- Mapa de Rutas Complementarias -->
      <ng-container *ngIf="activeTab() === 'heatmap'">
        <app-route-heatmap 
          [mapa]="mapa$ | async">
        </app-route-heatmap>
      </ng-container>

    </div>
  </main>
</div>
