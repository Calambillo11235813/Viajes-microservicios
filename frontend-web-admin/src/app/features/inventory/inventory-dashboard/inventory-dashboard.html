<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-blue-800 text-white flex flex-col hidden md:flex">
    <div class="p-6">
      <h2 class="text-2xl font-bold tracking-tight">Admin<span class="text-blue-300">Viajes</span></h2>
      <p class="text-xs text-blue-200 mt-1">Gestión Operativa</p>
    </div>
    <nav class="flex-1 px-4 space-y-2 mt-4">
      <a routerLink="/admin/rutas" routerLinkActive="bg-blue-900 border-l-4 border-blue-400" class="block px-4 py-3 rounded hover:bg-blue-700 transition-colors">
        📍 Rutas y Destinos
      </a>
      <a routerLink="/admin/viajes" routerLinkActive="bg-blue-900 border-l-4 border-blue-400" class="block px-4 py-3 rounded hover:bg-blue-700 transition-colors">
        🚌 Programación Viajes
      </a>
      <a routerLink="/admin/flotas" routerLinkActive="bg-blue-900 border-l-4 border-blue-400" class="block px-4 py-3 rounded hover:bg-blue-700 transition-colors">
        ⚙️ Flotas y Personal
      </a>
    </nav>
    <div class="p-4 border-t border-blue-700">
      <div class="flex items-center mb-4">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold mr-3">A</div>
        <div class="text-sm">
          <p class="font-medium">Administrador</p>
        </div>
      </div>
      <button (click)="logout()" class="w-full bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm transition-colors text-white font-medium">
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-sm h-16 flex items-center px-6 justify-between md:justify-end">
      <button class="md:hidden text-gray-500 hover:text-gray-700 focus:outline-none">
        <!-- Menú hamburguesa (Móvil) -->
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="text-sm text-gray-500">
        Panel de Control > <span class="font-semibold text-gray-800">Operaciones</span>
      </div>
    </header>
    
    <div class="flex-1 overflow-y-auto p-6">
      <!-- Routing hijo (Rutas, Viajes, Flotas) -->
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
