version: '3.8'

services:
  web:
    build: .
    container_name: motor_ia_web
    command: gunicorn motor_ia.wsgi:application --bind 0.0.0.0:8080 --workers 1 --timeout 120
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro  # Mapear credenciales ADC locales
    ports:
      - "8080:8080"
    env_file:
      - .env
