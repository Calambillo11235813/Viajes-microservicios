version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: motor_ia_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: motor_ia_web
    command: gunicorn motor_ia.wsgi:application --bind 0.0.0.0:8080 --workers 1 --timeout 120
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro  # Mapear credenciales ADC locales
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: motor_ia_celery
    command: celery -A motor_ia worker --loglevel=info
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  redis_data:
